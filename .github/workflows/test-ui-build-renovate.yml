name: Test UI build for Renovate PRs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # Only run if the PR head branch starts with 'renovate-'
    if: startsWith(github.head_ref, 'renovate-')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check production UI build contract
        run: python3 tests/test_ui_build.py -v

      # Exercise the exact production Node image and package-manager bootstrap,
      # rather than an unrelated host Node version with preinstalled Corepack.
      - name: Build production UI stage
        run: docker build --target ui --file Containerfile --tag idp-ui-test .
