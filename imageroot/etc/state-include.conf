#
# idp state/backup include patterns for Restic.
# Only lines starting with "state/" or "volumes/" are considered by NS8.
# state/environment is always included by NS8.

# Database and Keycloak credentials. They must be restored together: the
# restored database is initialized with the password of this file.
state/passwords.env

# Logical PostgreSQL dump written by module-dump-state (realms, users,
# clients, keys). The pgdata volume is NOT backed up: its files are not a
# consistent copy while the server runs, and it is rebuilt from the dump.
state/idp.pg_dump

# Not included on purpose: state/ns8-agent.json. keycloak-init creates a new
# secret for the ns8-agent client when the file is missing, so the restored
# module never reuses the credentials of the source module.
